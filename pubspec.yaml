name: my_ebook_reader
description: Fast, lightweight Android eBook, PDF, Word, HWP, TXT, and Comic Reader.
publish_to: 'none'
version: 2.35.0+122

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_epub_viewer: 2.2.1
  flutter_inappwebview: 6.2.0-beta.3
  file_picker: ^10.1.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hwp/
    - assets/hwp/fonts/
    - assets/docx/
    - assets/docx/engine/
    - assets/docx/metafile/
